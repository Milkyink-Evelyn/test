<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>是花花~</title>
</head>
<style>
    .box {
        width: 255.8px;
        height: 341.2px;
        position: relative;
        border: 1px solid black;
        border-radius: 10px;
        overflow: hidden;
    }
    img{
        width: 100%;
        height: 100%;
        transition: all 1.5s ease;
    }
    .box:hover img{
            transform: scale(3.3);
        }
    .love {
            width: 255.8px;
            height: 170.6px;
            position: absolute;
            text-align: center;
            transform: translateY(-60PX);
            color: #fff;
            transition: all 1s ease;
            }
    .box:hover .love {
            transform: translateY(-150px);
        }
    
    </style>
<body>
    <div class="box">
        <img src="花.jpg" alt="花">
        <div class="love">
            <h2 style="color: aqua;">Mine</h2>
            <p style=" color: hotpink;">❤️ Best Friend ❤️</p>
        </div>
    </div>
</body>
</html>
